<!-- Create a basic HTML structure with:
● An input field for entering new items.
● A button to add items to the list.
● An unordered list to display the shopping list items. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping-List</title>
    <link rel="stylesheet" href="./index.css"></link>
</head>
<body>
    <h1>Shopping List</h1>
    <label for="new-item">Item</label>
    <input type="text" id="new-item" name="new-item" placeholder="Enter the item" required/>
    
    <button id="add-item">Add</button>

    <ul id="list">
        
    </ul>
    
    <script src="./index.js"></script>

</body>
</html>
